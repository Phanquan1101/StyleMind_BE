spring.application.name=notification-service
server.port=${SERVER_PORT:8086}
spring.datasource.url=${STYLEMIND_NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/stylemind_notification}
spring.datasource.username=${STYLEMIND_NOTIFICATION_DB_USERNAME:}
spring.datasource.password=${STYLEMIND_NOTIFICATION_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.mail.host=${STYLEMIND_SMTP_HOST:localhost}
spring.mail.port=${STYLEMIND_SMTP_PORT:1025}
spring.mail.username=${STYLEMIND_SMTP_USERNAME:}
spring.mail.password=${STYLEMIND_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${STYLEMIND_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${STYLEMIND_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=${STYLEMIND_SMTP_CONNECT_TIMEOUT_MS:3000}
spring.mail.properties.mail.smtp.timeout=${STYLEMIND_SMTP_READ_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${STYLEMIND_SMTP_WRITE_TIMEOUT_MS:5000}
stylemind.security.service-token=${STYLEMIND_SERVICE_TOKEN:}
stylemind.email.from=${STYLEMIND_EMAIL_FROM:no-reply@stylemind.local}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
stylemind.security.jwt.jwk-set-uri=${STYLEMIND_JWT_JWK_SET_URI:}
stylemind.security.jwt.jws-algorithm=${STYLEMIND_JWT_JWS_ALGORITHM:}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level service=${spring.application.name} correlationId=%X{correlationId:-} [%thread] %logger{36} - %msg%n
