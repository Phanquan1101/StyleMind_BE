spring.application.name=commerce-service
server.port=${SERVER_PORT:8082}
spring.datasource.url=${STYLEMIND_COMMERCE_DB_URL:jdbc:postgresql://localhost:5432/stylemind_commerce}
spring.datasource.username=${STYLEMIND_COMMERCE_DB_USERNAME:}
spring.datasource.password=${STYLEMIND_COMMERCE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
stylemind.security.jwt.jwk-set-uri=${STYLEMIND_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
stylemind.security.jwt.jws-algorithm=${STYLEMIND_JWT_JWS_ALGORITHM:RS256}
stylemind.identity.base-url=${STYLEMIND_IDENTITY_BASE_URL:http://localhost:8081}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level service=${spring.application.name} correlationId=%X{correlationId:-} [%thread] %logger{36} - %msg%n
