spring.application.name=commerce-service
server.port=${SERVER_PORT:8082}
spring.datasource.url=${STYLEMIND_COMMERCE_DB_URL:jdbc:postgresql://localhost:5432/stylemind_commerce}
spring.datasource.username=${STYLEMIND_COMMERCE_DB_USERNAME:}
spring.datasource.password=${STYLEMIND_COMMERCE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
stylemind.security.jwt.jwk-set-uri=${STYLEMIND_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
stylemind.security.jwt.jws-algorithm=${STYLEMIND_JWT_JWS_ALGORITHM:RS256}
stylemind.identity.base-url=${STYLEMIND_IDENTITY_BASE_URL:http://localhost:8081}
stylemind.payment.base-url=${STYLEMIND_PAYMENT_BASE_URL:http://localhost:8083}
stylemind.payment.handoff-token=${STYLEMIND_COMMERCE_PAYMENT_TOKEN:}
stylemind.security.service-token=${STYLEMIND_SERVICE_TOKEN:}
stylemind.commerce.image-storage.cloudinary-url=${CLOUDINARY_URL:}
stylemind.commerce.image-storage.cloudinary-folder=${CLOUDINARY_FOLDER:stylemind/products}
stylemind.commerce.image-storage.local-directory=${STYLEMIND_LEGACY_IMAGE_DIRECTORY:target/variant-images}
stylemind.commerce.catalog-seed.enabled=${STYLEMIND_CATALOG_SEED_ENABLED:false}
stylemind.commerce.inventory.expiry-enabled=${STYLEMIND_INVENTORY_EXPIRY_ENABLED:true}
stylemind.commerce.inventory.expiry-scan-ms=${STYLEMIND_INVENTORY_EXPIRY_SCAN_MS:60000}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level service=${spring.application.name} correlationId=%X{correlationId:-} [%thread] %logger{36} - %msg%n

stylemind.payment.ingress-token=${STYLEMIND_COMMERCE_SERVICE_TOKEN:}

# Do not dump guest session credentials in HTTP payload debug logs.
logging.level.org.springframework.web.servlet.mvc.method.annotation=INFO
