spring.application.name=identity-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${STYLEMIND_IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/stylemind_identity}
spring.datasource.username=${STYLEMIND_IDENTITY_DB_USERNAME:}
spring.datasource.password=${STYLEMIND_IDENTITY_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
stylemind.jwt.issuer=${STYLEMIND_JWT_ISSUER:https://identity.stylemind.local}
stylemind.jwt.audience=${STYLEMIND_JWT_AUDIENCE:stylemind-api}
stylemind.jwt.private-key-path=${STYLEMIND_JWT_PRIVATE_KEY_PATH:}
stylemind.jwt.access-ttl=${STYLEMIND_JWT_ACCESS_TTL:PT15M}
stylemind.jwt.refresh-ttl=${STYLEMIND_JWT_REFRESH_TTL:P7D}
stylemind.verification.hmac-secret=${STYLEMIND_VERIFICATION_HMAC_SECRET:}
stylemind.notification.base-url=${STYLEMIND_NOTIFICATION_BASE_URL:http://localhost:8086}
stylemind.notification.service-token=${STYLEMIND_SERVICE_TOKEN:}
stylemind.security.service-token=${STYLEMIND_SERVICE_TOKEN:}
spring.cloud.openfeign.client.config.notification-service.connect-timeout=${STYLEMIND_NOTIFICATION_CONNECT_TIMEOUT_MS:3000}
spring.cloud.openfeign.client.config.notification-service.read-timeout=${STYLEMIND_NOTIFICATION_READ_TIMEOUT_MS:5000}
spring.cloud.openfeign.client.config.notification-service.follow-redirects=false
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level service=${spring.application.name} correlationId=%X{correlationId:-} [%thread] %logger{36} - %msg%n
