spring.application.name=wardrobe-community-service
server.port=${SERVER_PORT:8084}
spring.datasource.url=${STYLEMIND_WARDROBE_COMMUNITY_DB_URL:jdbc:postgresql://localhost:5432/stylemind_wardrobe_community}
spring.datasource.username=${STYLEMIND_WARDROBE_COMMUNITY_DB_USERNAME:}
spring.datasource.password=${STYLEMIND_WARDROBE_COMMUNITY_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
stylemind.security.jwt.jwk-set-uri=${STYLEMIND_JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
stylemind.security.jwt.jws-algorithm=${STYLEMIND_JWT_JWS_ALGORITHM:RS256}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level service=${spring.application.name} correlationId=%X{correlationId:-} [%thread] %logger{36} - %msg%n
stylemind.commerce.base-url=${STYLEMIND_COMMERCE_BASE_URL:http://localhost:8082}
stylemind.security.service-token=${STYLEMIND_SERVICE_TOKEN:}
spring.cloud.openfeign.client.config.commerce-service.connect-timeout=3000
spring.cloud.openfeign.client.config.commerce-service.read-timeout=5000
spring.cloud.openfeign.client.config.commerce-service.follow-redirects=false
