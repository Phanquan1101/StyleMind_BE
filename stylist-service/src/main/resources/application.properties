spring.application.name=stylist-service
server.port=${SERVER_PORT:8085}
spring.datasource.url=${STYLEMIND_STYLIST_DB_URL:jdbc:postgresql://localhost:5432/stylemind_stylist}
spring.datasource.username=${STYLEMIND_STYLIST_DB_USERNAME:}
spring.datasource.password=${STYLEMIND_STYLIST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
stylemind.security.jwt.jwk-set-uri=${STYLEMIND_JWT_JWK_SET_URI:}
stylemind.security.jwt.jws-algorithm=${STYLEMIND_JWT_JWS_ALGORITHM:RS256}
stylemind.security.jwt.issuer=${STYLEMIND_JWT_ISSUER:https://identity.stylemind.local}
stylemind.security.jwt.audience=${STYLEMIND_JWT_AUDIENCE:stylemind-api}
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
stylemind.clients.commerce.base-url=${STYLEMIND_COMMERCE_BASE_URL:http://localhost:8082}
stylemind.clients.commerce.connect-timeout-ms=${STYLEMIND_COMMERCE_CONNECT_TIMEOUT_MS:1000}
stylemind.clients.commerce.read-timeout-ms=${STYLEMIND_COMMERCE_READ_TIMEOUT_MS:2000}
stylemind.stylist.generation.deadline-ms=${STYLEMIND_STYLIST_GENERATION_DEADLINE_MS:30000}
stylemind.stylist.retrieval.qdrant-url=${STYLEMIND_STYLIST_QDRANT_URL:}
stylemind.stylist.retrieval.collection-alias=${STYLEMIND_STYLIST_QDRANT_COLLECTION_ALIAS:}
stylemind.stylist.retrieval.embedding-dimensions=1536
stylemind.stylist.retrieval.text-template-revision=${STYLEMIND_STYLIST_TEXT_TEMPLATE_REVISION:catalog-v1}
stylemind.stylist.catalog.policy-file=${STYLEMIND_STYLIST_CATALOG_POLICY_FILE:}
stylemind.stylist.catalog.import-enabled=${STYLEMIND_STYLIST_CATALOG_IMPORT_ENABLED:false}
stylemind.stylist.knowledge.artifact-id=${STYLEMIND_STYLIST_KNOWLEDGE_ARTIFACT_ID:}
stylemind.stylist.knowledge.artifact-version=${STYLEMIND_STYLIST_KNOWLEDGE_ARTIFACT_VERSION:}
stylemind.stylist.knowledge.neo4j-uri=${STYLEMIND_STYLIST_NEO4J_URI:}
stylemind.stylist.knowledge.neo4j-username=${STYLEMIND_STYLIST_NEO4J_USERNAME:}
stylemind.stylist.knowledge.neo4j-password=${STYLEMIND_STYLIST_NEO4J_PASSWORD:}
stylemind.stylist.knowledge.enabled=${STYLEMIND_STYLIST_NEO4J_ENABLED:false}
stylemind.stylist.knowledge.import-file=${STYLEMIND_STYLIST_KNOWLEDGE_IMPORT_FILE:}
stylemind.ai.provider=${STYLEMIND_AI_PROVIDER:openai}
stylemind.openai.enabled=${STYLEMIND_OPENAI_ENABLED:false}
stylemind.openai.api-key=${STYLEMIND_OPENAI_API_KEY:}
stylemind.gemini.api-key=${STYLEMIND_GEMINI_API_KEY:}
stylemind.gemini.generation-model=${STYLEMIND_GEMINI_GENERATION_MODEL:gemini-3.5-flash-lite}
stylemind.gemini.live-calls-enabled=${STYLEMIND_GEMINI_LIVE_CALLS_ENABLED:false}
spring.ai.model.chat=none
spring.ai.model.embedding=none
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level service=${spring.application.name} correlationId=%X{correlationId:-} [%thread] %logger{36} - %msg%n
