spring.application.name=payment-service
stylemind.payment.handoff-token=${STYLEMIND_COMMERCE_PAYMENT_TOKEN:}
server.port=${SERVER_PORT:8083}
spring.datasource.url=${STYLEMIND_PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/stylemind_payment}
spring.datasource.username=${STYLEMIND_PAYMENT_DB_USERNAME:}
spring.datasource.password=${STYLEMIND_PAYMENT_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
stylemind.security.jwt.jwk-set-uri=${STYLEMIND_JWT_JWK_SET_URI:}
stylemind.security.jwt.jws-algorithm=${STYLEMIND_JWT_JWS_ALGORITHM:}
stylemind.payment.sepay.qr-bank-name=${STYLEMIND_SEPAY_QR_BANK_NAME:}
stylemind.payment.sepay.qr-account-number=${STYLEMIND_SEPAY_QR_ACCOUNT_NUMBER:}
stylemind.payment.sepay.qr-account-name=${STYLEMIND_SEPAY_QR_ACCOUNT_NAME:}
stylemind.payment.sepay.payment-code-prefix=${STYLEMIND_SEPAY_PAYMENT_CODE_PREFIX:SM}
stylemind.payment.commerce.base-url=${STYLEMIND_COMMERCE_INTERNAL_BASE_URL:}
stylemind.payment.commerce.service-token=${STYLEMIND_COMMERCE_SERVICE_TOKEN:}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level service=${spring.application.name} correlationId=%X{correlationId:-} [%thread] %logger{36} - %msg%n
