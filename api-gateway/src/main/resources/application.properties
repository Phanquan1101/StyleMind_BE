spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.swagger-ui.urls[0].name=Identity Service
springdoc.swagger-ui.urls[0].url=/identity/v3/api-docs
springdoc.swagger-ui.urls[1].name=Commerce Service
springdoc.swagger-ui.urls[1].url=/commerce/v3/api-docs
springdoc.swagger-ui.urls[2].name=Payment Service
springdoc.swagger-ui.urls[2].url=/payment/v3/api-docs
springdoc.swagger-ui.urls[3].name=Wardrobe Community Service
springdoc.swagger-ui.urls[3].url=/wardrobe-community/v3/api-docs
springdoc.swagger-ui.urls[4].name=Stylist Service
springdoc.swagger-ui.urls[4].url=/stylist/v3/api-docs
springdoc.swagger-ui.urls[5].name=Notification Service
springdoc.swagger-ui.urls[5].url=/notification/v3/api-docs

# Current client-facing business APIs are owned by Identity. Preserve the original
# path, HTTP method, headers and body while forwarding them to that service.
spring.cloud.gateway.server.webflux.routes[0].id=identity-public-api
stylemind.gateway.identity-base-url=${STYLEMIND_IDENTITY_BASE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].uri=${stylemind.gateway.identity-base-url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/**,/.well-known/jwks.json

spring.cloud.gateway.server.webflux.routes[1].id=identity-prefixed-api
spring.cloud.gateway.server.webflux.routes[1].uri=${stylemind.gateway.identity-base-url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/identity/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[2].id=commerce-prefixed-api
stylemind.gateway.commerce-base-url=${STYLEMIND_COMMERCE_BASE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[2].uri=${stylemind.gateway.commerce-base-url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/commerce/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[3].id=payment-prefixed-api
stylemind.gateway.payment-base-url=${STYLEMIND_PAYMENT_BASE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[3].uri=${stylemind.gateway.payment-base-url}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/payment/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[4].id=wardrobe-community-prefixed-api
stylemind.gateway.wardrobe-community-base-url=${STYLEMIND_WARDROBE_COMMUNITY_BASE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[4].uri=${stylemind.gateway.wardrobe-community-base-url}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/wardrobe-community/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[5].id=stylist-prefixed-api
stylemind.gateway.stylist-base-url=${STYLEMIND_STYLIST_BASE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[5].uri=${stylemind.gateway.stylist-base-url}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/stylist/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[6].id=notification-prefixed-api
stylemind.gateway.notification-base-url=${STYLEMIND_NOTIFICATION_BASE_URL:http://localhost:8086}
spring.cloud.gateway.server.webflux.routes[6].uri=${stylemind.gateway.notification-base-url}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/notification/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=1
