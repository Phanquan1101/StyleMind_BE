spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Current client-facing business APIs are owned by Identity. Preserve the original
# path, HTTP method, headers and body while forwarding them to that service.
spring.cloud.gateway.server.webflux.routes[0].id=identity-public-api
stylemind.gateway.identity-base-url=${STYLEMIND_IDENTITY_BASE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].uri=${stylemind.gateway.identity-base-url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/**,/.well-known/jwks.json,/v3/api-docs,/v3/api-docs/**
